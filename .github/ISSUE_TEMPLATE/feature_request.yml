name: 💡 功能建议 / Feature request
description: 提一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先确认它不在「刻意不做」的清单里：

        - 明文 CSV 导出 —— **永久不做**
        - 云同步 / 任何联网功能 —— 与本项目的核心前提冲突，不做
        - kdbx 导入、CXF 对接 —— 1.0 阶段不做
        - 胁迫密码 / 假库 —— 不做，半吊子的假库比没有更危险
        - 主密码找回 —— 不存在，这是设计目标不是缺陷

        理由都写在 README 和 SECURITY.md 里。

  - type: textarea
    id: problem
    attributes:
      label: 你实际遇到的问题是什么
      description: 先说问题，不要直接说解决方案。很多功能请求背后的问题有更简单的解法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: 这个功能会不会扩大攻击面
      description: |
        对密码管理器来说这是必答题。比如：是否需要新权限？是否让明文多经过一个环节？
        是否需要新的第三方依赖？想不清楚也可以写「不确定」。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认这个功能不需要联网权限
          required: true
