# 关掉空白 issue，把三类流量分流：
#   安全问题 → 私密渠道（最重要，绝不能变成公开 issue）
#   使用问题 → Discussions
#   其余     → 结构化模板
blank_issues_enabled: false
contact_links:
  - name: 🔒 报告安全漏洞（不要开公开 Issue）
    url: https://github.com/sailinsky76/REPO/security/advisories/new
    about: 公开 issue 会在修复发布之前把利用方式告诉所有人。请走私密报告，详见 SECURITY.md。
  - name: 💬 使用问题与讨论
    url: https://github.com/sailinsky76/REPO/discussions
    about: 「怎么用」「这个设计为什么这样」这类问题请发到 Discussions。
  - name: 📖 设计决策与踩坑记录
    url: https://github.com/sailinsky76/REPO/blob/main/PROGRESS.md
    about: 提问之前建议先翻一下 PROGRESS.md，很多「为什么不那样做」里面有答案。
